<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<meta name="theme-color" content="#4f7cff">
<meta name="description" content="아이디어 메모, 업무, 여행 계획을 정리하는 마인드맵">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마인드맵">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<title>K 마인드맵</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 홈: 맵 목록 -->
<section id="home" class="screen">
  <header class="bar">
    <h1>🧠 K 마인드맵</h1>
    <button id="btnSettings" class="icon" aria-label="설정">⚙︎</button>
  </header>
  <div class="searchwrap"><input id="search" type="search" placeholder="맵 · 메모 검색" autocomplete="off"></div>
  <main id="mapList" class="list"></main>
  <footer class="homebar">
    <button id="btnQuick" class="btn">💡 빠른 메모</button>
    <button id="btnNew" class="btn primary">＋ 새 맵</button>
  </footer>
</section>

<!-- 편집기 -->
<section id="editor" class="screen" hidden>
  <header class="bar">
    <button id="btnBack" class="icon" aria-label="뒤로">‹</button>
    <button id="mapTitle" class="title" aria-label="제목 편집"></button>
    <button id="btnUndo" class="icon" aria-label="실행 취소">↶</button>
    <button id="btnRedo" class="icon" aria-label="다시 실행">↷</button>
    <button id="btnView" class="icon" aria-label="보기 전환">☰</button>
    <button id="btnMenu" class="icon" aria-label="메뉴">⋮</button>
  </header>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
    <div id="outline" hidden></div>
    <button id="btnFit" class="fab-fit" aria-label="화면에 맞추기">⌖</button>
  </div>
  <footer id="toolbar">
    <div class="row more" id="moreRow" hidden>
      <button data-act="up"><i>↑</i>위로</button>
      <button data-act="down"><i>↓</i>아래로</button>
      <button data-act="outdent"><i>⇤</i>내어쓰기</button>
      <button data-act="indent"><i>⇥</i>들여쓰기</button>
      <button data-act="fold"><i>▾</i><span id="foldLabel">접기</span></button>
      <button data-act="dup"><i>⧉</i>복제</button>
      <button data-act="del" class="danger"><i>🗑</i>삭제</button>
    </div>
    <div class="row main">
      <button data-act="child"><i>↳</i>하위</button>
      <button data-act="sibling"><i>↓</i>형제</button>
      <button data-act="edit"><i>✎</i>편집</button>
      <button data-act="check"><i>☑</i>체크</button>
      <button data-act="more"><i>⋯</i>더보기</button>
    </div>
  </footer>

  <!-- 노드 편집 시트 (키보드 유지를 위해 하나를 재사용) -->
  <div id="editSheet" class="sheet" hidden>
    <div class="backdrop" id="edBackdrop"></div>
    <div class="panel">
      <textarea id="edText" rows="2" placeholder="내용 입력" enterkeyhint="next"></textarea>
      <div id="edColors" class="colors"></div>
      <textarea id="edNote" rows="2" placeholder="메모 (선택)"></textarea>
      <div class="panel-actions">
        <span class="hint">Enter ↵ 다음 항목 연속 입력</span>
        <button id="edDone" class="btn primary">완료</button>
      </div>
    </div>
  </div>
</section>

<div id="sheetRoot"></div>
<div id="toast" role="status"></div>
<input type="file" id="filePick" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
